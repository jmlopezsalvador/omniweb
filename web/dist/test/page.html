<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página de pruebas — scroll infinito</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
  .card { margin: 12px; background: #222; border-radius: 8px; overflow: hidden; }
  .card img, .card .bg { display: block; width: 100%; height: 220px; object-fit: cover; }
  .card .bg { background-size: cover; background-position: center; }
  .card .src { margin: 0 12px 12px; font-size: 12px; color: #999; }
  .card h3 { margin: 8px 12px 12px; font-size: 16px; }
</style>
</head>
<body>
<img id="logo" alt="logo" style="position:fixed;top:8px;left:8px;width:80px;height:80px;z-index:5">
<div id="feed"></div>
<div id="sentinel" style="height:1px"></div>
<script>
  // Imagen de relleno determinista: SVG con el número de tarjeta
  function ph(n) {
    var hue = (n * 47) % 360;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220"><rect width="400" height="220" fill="hsl(' + hue + ',50%,40%)"/><text x="200" y="125" font-size="60" text-anchor="middle" fill="white">#' + n + '</text></svg>';
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }
  var params = new URLSearchParams(location.search);
  document.getElementById('logo').src = ph(0);
  var rerender = params.get('rerender') === '1'; // simula React/Vue repintando el src
  var feed = document.getElementById('feed');
  var n = 0;

  function card(i) {
    var c = document.createElement('div');
    c.className = 'card';
    c.dataset.n = i;
    var kind = i % 3;
    if (kind === 0) {
      c.innerHTML = '<a href="detail.html?n=' + i + '"><img loading="lazy" src="' + ph(i) + '" srcset="' + ph(i) + ' 1x" alt="Foto ' + i + '"></a>';
    } else if (kind === 1) {
      c.innerHTML = '<a href="detail.html?n=' + i + '"><picture><source srcset="' + ph(i) + '" type="image/svg+xml"><img src="' + ph(i) + '" alt="Foto ' + i + '"></picture></a>';
    } else {
      c.innerHTML = '<a href="detail.html?n=' + i + '"><div class="bg" style="background-image:url(\'' + ph(i) + '\')"></div></a>';
    }
    c.insertAdjacentHTML('beforeend', '<h3>Título original ' + i + '</h3><div class="src">Fuente ' + i + '</div>');
    return c;
  }
  function more() { for (var k = 0; k < 10; k++) feed.appendChild(card(++n)); }
  more();
  new IntersectionObserver(function (e) { if (e[0].isIntersecting) more(); }, { rootMargin: '1500px' })
    .observe(document.getElementById('sentinel'));

  // Los enlaces de las tarjetas no navegan en las pruebas: se anota el clic (si llega a la web).
  //   ?realnav=1 → navegan de verdad a detail.html (ficha en OTRA página, como Amazon).
  //   ?panel=1   → abren un panel con la ficha en la MISMA página (como Google Imágenes), sin cambiar de URL.
  var realnav = params.get('realnav') === '1';
  var panelMode = params.get('panel') === '1';
  //   &reuse=1   → el panel ya existe oculto desde el principio y se limita a mostrarse (la web reutiliza sus elementos).
  //   &overlay=1 → una capa transparente de la propia web tapa la imagen de la ficha (enlace/botón superpuesto).
  var reuse = params.get('reuse') === '1';
  var overlay = params.get('overlay') === '1';
  function buildPanel(n) {
    var p = document.createElement('div');
    p.id = 'panel';
    p.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:10;overflow:hidden';
    var hero = '<img id="hero" alt="ficha" style="display:block;width:100%;height:300px;object-fit:cover" src="' + ph(100 + n) + '">';
    if (overlay) hero = '<div style="position:relative">' + hero + '<div id="cover" style="position:absolute;left:0;top:0;right:0;bottom:0"></div></div>';
    p.innerHTML = hero +
      '<h2 id="ptitle" style="margin:12px">Ficha original ' + n + '</h2><div style="margin:12px;font-size:13px">Fuente de la ficha</div>' +
      '<div style="display:flex;gap:6px;margin:12px"><img class="rel" alt="r1" width="60" height="60" src="' + ph(200) + '"><img class="rel" alt="r2" width="60" height="60" src="' + ph(201) + '"></div>' +
      '<button id="close" style="margin:12px;padding:10px 20px">Cerrar</button>';
    document.body.appendChild(p);
    p.querySelector('#close').addEventListener('click', function () { if (reuse) p.style.display = 'none'; else p.remove(); });
    return p;
  }
  var prePanel = null;
  if (panelMode && reuse) { prePanel = buildPanel(0); prePanel.style.display = 'none'; }
  function openPanel(n) {
    if (prePanel) {
      prePanel.querySelector('#hero').setAttribute('src', ph(100 + n));
      prePanel.querySelector('#ptitle').textContent = 'Ficha original ' + n;
      prePanel.style.display = 'block';
    } else buildPanel(n);
  }
  //   &shift=1   → al APOYAR el dedo la web recoloca la rejilla (mete un hueco sobre la tarjeta tocada): bajo el dedo, al soltar, hay otra.
  //   &recycle=1 → al abrir la ficha la web «recicla» la tarjeta: intercambia el contenido de la tocada con el de la siguiente.
  if (params.get('shift') === '1') {
    document.addEventListener('pointerdown', function (e) {
      var c = e.target.closest && e.target.closest('.card');
      if (!c || window.__shifted) return;
      window.__shifted = 1;
      var sp = document.createElement('div');
      sp.style.height = '300px';
      c.parentNode.insertBefore(sp, c);
    }, true);
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    if (params.get('recycle') === '1') {
      var c1 = a.closest('.card'), c2 = c1 && c1.nextElementSibling;
      if (c2 && c2.classList.contains('card')) { var h = c1.innerHTML; c1.innerHTML = c2.innerHTML; c2.innerHTML = h; }
    }
    window.__linkClicked = a.getAttribute('href');
    if (panelMode) { e.preventDefault(); openPanel(+a.getAttribute('href').split('=')[1]); }
    else if (!realnav) e.preventDefault();
  });

  // Imita webs como YouTube móvil: «navegan» con pointerup/touchend, no con click
  if (params.get('navonpointer') === '1') {
    ['pointerup', 'touchend', 'mouseup'].forEach(function (t) {
      document.addEventListener(t, function (e) {
        var c = e.target.closest && e.target.closest('.card');
        if (c) window.__navigated = c.dataset.n;
      });
    });
  }

  if (rerender) {
    // Cada 150 ms «el framework» restaura el src original de las imágenes
    setInterval(function () {
      document.querySelectorAll('.card').forEach(function (c) {
        var i = +c.dataset.n;
        var img = c.querySelector('img');
        if (img && img.getAttribute('src') !== ph(i)) img.setAttribute('src', ph(i));
        var bg = c.querySelector('.bg');
        if (bg && bg.style.backgroundImage.indexOf(encodeURIComponent('#' + i + '<')) < 0) bg.style.backgroundImage = "url('" + ph(i) + "')";
      });
    }, 150);
  }
</script>
</body>
</html>
